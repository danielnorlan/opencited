name: Nightly

# The live smoke test against SSB's API. 01:17 UTC is 02:17 or 03:17 in Oslo, outside
# 04:55 to 08:15 and 11:25 to 11:45 Norwegian time, which scheduled jobs avoid
# (ADR 0007, decision 6). A run started by hand should avoid them too; from 05:00 to
# 08:15 the query test expects the error that names SSB's revision period.
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  live:
    name: Live smoke test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Install
        run: uv sync --locked
      - name: Run the live tests
        run: uv run --frozen pytest -m live
