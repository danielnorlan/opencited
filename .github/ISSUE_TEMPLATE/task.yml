name: Task
description: A unit of work with acceptance criteria.
body:
  - type: input
    id: spec
    attributes:
      label: Specification
      description: Link to the approved specification in docs/specs, if there is one.
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What is true when this task is done?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: What must be true when the task is done.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
  - type: textarea
    id: notes
    attributes:
      label: Notes
