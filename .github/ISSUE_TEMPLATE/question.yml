name: Question or idea
description: Ask about the project or suggest a source, a feature or an improvement.
body:
  - type: textarea
    id: question
    attributes:
      label: Question or idea
      description: What would you like to know or see?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links, examples or the use you have in mind.
